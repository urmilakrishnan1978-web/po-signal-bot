<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PO-iSNIPER OTC - OTC SIGNAL ENGINE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Rajdhani', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        body {
            background-color: #06070c;
            color: #ffffff;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 18px;
            color: #00ffcc;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 10px 0;
            border-bottom: 1px solid rgba(0,255,204,0.2);
            text-shadow: 0 0 12px rgba(0,255,204,0.5);
        }
        .controls-card {
            background: #0d0f18;
            border: 1px solid #161928;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn-group {
            display: flex;
            background: #06070c;
            border-radius: 8px;
            padding: 3px;
            gap: 4px;
        }
        .btn-toggle {
            flex: 1;
            padding: 9px;
            border: none;
            background: transparent;
            color: #5a6282;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 11px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-toggle.active {
            background: #00ffcc;
            color: #06070c;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
        }
        .page {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .hidden {
            display: none !important;
        }
        .pairs-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            max-height: 65vh;
            overflow-y: auto;
            padding-right: 4px;
        }
        .pair-card {
            background: #0d0f18;
            border: 1px solid #161928;
            border-radius: 10px;
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
            transition: transform 0.1s ease, border-color 0.2s ease;
        }
        .pair-card:active {
            transform: scale(0.97);
            border-color: #00ffcc;
        }
        .pair-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 13px;
            color: #ffffff;
        }
        .pair-type {
            font-size: 11px;
            color: #00ffcc;
            font-weight: 700;
        }
        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 700;
            margin-top: 4px;
        }
        .price-up {
            color: #00ff66;
        }
        .price-down {
            color: #ff0055;
        }
        .selected-pair-banner {
            background: #0d0f18;
            border: 2px solid #00ffcc;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 900;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .back-btn {
            background: #161928;
            border: none;
            color: #00ffcc;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        .gauge-card {
            background: #0d0f18;
            border: 1px solid #161928;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }
        .gauge-title {
            font-size: 12px;
            color: #5a6282;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .gauge-val {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 900;
        }
        .indicators-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        .ind-box {
            background: #0d0f18;
            border: 1px solid #161928;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }
        .ind-label {
            color: #5a6282;
            font-weight: 600;
        }
        .ind-val {
            font-weight: 800;
        }
        .btn-generate {
            background: linear-gradient(135deg, #9d00ff 0%, #7c3aed 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(157, 0, 255, 0.4);
            transition: transform 0.1s ease;
            margin-top: 8px;
        }
        .btn-generate:active {
            transform: scale(0.98);
        }
        .signal-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(6, 7, 12, 0.92);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 20px;
        }
        .modal-content {
            background: #0d0f18;
            border: 2px solid #00ffcc;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 320px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
        }
        .signal-call {
            color: #00ff66;
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 900;
        }
        .signal-put {
            color: #ff0055;
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 900;
        }
    </style>
</head>
<body>

    <div class="header">PO-iSNIPER OTC ENGINE</div>

    <!-- PAGE 1: PAIRS SELECTION -->
    <div id="page-select" class="page">
        <div class="controls-card">
            <div class="btn-group">
                <button class="btn-toggle active" id="btn-po" onclick="setPlatform('PO')">POCKET OPTION</button>
                <button class="btn-toggle" id="btn-qx" onclick="setPlatform('QX')">QUOTEX</button>
            </div>
            <div class="btn-group">
                <button class="btn-toggle active" id="btn-otc" onclick="setMarket('OTC')">OTC MARKET</button>
                <button class="btn-toggle" id="btn-live" onclick="setMarket('LIVE')">LIVE MARKET</button>
            </div>
        </div>

        <div style="font-size: 12px; font-weight: 700; color: #5a6282; display: flex; justify-content: space-between;">
            <span>AVAILABLE CURRENCY PAIRS</span>
            <span style="color:#00ffcc;">54 PAIRS</span>
        </div>

        <div class="pairs-grid" id="pairs-container"></div>
    </div>

    <!-- PAGE 2: LIVE SIGNAL ANALYSIS -->
    <div id="page-signal" class="page hidden">
        <div class="selected-pair-banner">
            <button class="back-btn" onclick="showPage('select')">← BACK</button>
            <span id="active-pair-name">GBP/USD OTC</span>
            <span style="font-size:10px; color:#00ffcc;" id="active-platform-tag">PO OTC</span>
        </div>

        <div class="gauge-card">
            <div class="gauge-title">SENTIMENT METER SCAN</div>
            <div class="gauge-val price-down" id="sentiment-text">45% BEARISH</div>
        </div>

        <div class="indicators-grid">
            <div class="ind-box"><span class="ind-label">RSI (14)</span><span class="ind-val price-up" id="ind-rsi">56.4</span></div>
            <div class="ind-box"><span class="ind-label">MACD</span><span class="ind-val price-down" id="ind-macd">BEAR</span></div>
            <div class="ind-box"><span class="ind-label">SMA (20)</span><span class="ind-val price-up" id="ind-sma">ABOVE</span></div>
            <div class="ind-box"><span class="ind-label">EMA (50)</span><span class="ind-val price-up" id="ind-ema">BULL</span></div>
            <div class="ind-box"><span class="ind-label">FIBONACCI</span><span class="ind-val" style="color:#9d00ff">0.382</span></div>
            <div class="ind-box"><span class="ind-label">VOLATILITY</span><span class="ind-val price-down">HIGH</span></div>
        </div>

        <button class="btn-generate" onclick="generateSignal()">⚡ GENERATE OTC SIGNAL</button>
    </div>

    <!-- SIGNAL RESULT POPUP -->
    <div id="signal-modal" class="signal-modal hidden">
        <div class="modal-content">
            <div style="font-size: 12px; color: #5a6282; font-weight: 800;">CONFIRMED SIGNAL</div>
            <div id="modal-pair" style="font-size: 16px; font-weight: 900; color: #ffffff;">EUR/USD OTC</div>
            <div id="modal-signal" class="signal-call">CALL ▲</div>
            <div style="font-size: 12px; color: #00ffcc; font-weight: 700;">DURATION: 1 MINUTE</div>
            <button class="btn-generate" style="padding:10px; font-size:14px;" onclick="closeModal()">CLOSE</button>
        </div>
    </div>

    <script>
        const rawPairs = [
            "EUR/USD", "GBP/USD", "USD/JPY", "AUD/USD", "USD/CAD", "USD/CHF", "NZD/USD", "EUR/GBP", "EUR/JPY",
            "USD/INR", "USD/PKR", "USD/BDT", "USD/BRL", "USD/ARS", "USD/MXN", "USD/EGP", "USD/TRY", "USD/ZAR",
            "EUR/CAD", "EUR/AUD", "EUR/CHF", "EUR/NZD", "GBP/JPY", "GBP/CAD", "GBP/AUD", "GBP/CHF", "GBP/NZD",
            "AUD/JPY", "AUD/CAD", "AUD/CHF", "AUD/NZD", "CAD/JPY", "CAD/CHF", "CHF/JPY", "NZD/JPY", "NZD/CAD",
            "NZD/CHF", "EUR/TRY", "USD/CLP", "USD/COP", "USD/IDR", "USD/MYR", "USD/PHP", "USD/THB", "USD/VND",
            "EUR/RUB", "USD/RUB", "USD/NGN", "USD/KES", "USD/DZD", "USD/MAD", "USD/IQD", "USD/LKR", "USD/DOP"
        ];

        let currentPlatform = "PO";
        let currentMarket = "OTC";
        let selectedPair = "";
        let pairPrices = {};

        function initPrices() {
            rawPairs.forEach(p => {
                pairPrices[p] = {
                    price: (Math.random() * 2 + 0.5).toFixed(4),
                    change: (Math.random() * 2 - 1).toFixed(2)
                };
            });
        }

        function setPlatform(plat) {
            currentPlatform = plat;
            document.getElementById('btn-po').classList.toggle('active', plat === 'PO');
            document.getElementById('btn-qx').classList.toggle('active', plat === 'QX');
            renderPairs();
        }

        function setMarket(mkt) {
            currentMarket = mkt;
            document.getElementById('btn-otc').classList.toggle('active', mkt === 'OTC');
            document.getElementById('btn-live').classList.toggle('active', mkt === 'LIVE');
            renderPairs();
        }

        function renderPairs() {
            const container = document.getElementById('pairs-container');
            container.innerHTML = "";

            rawPairs.forEach(pair => {
                const fullName = currentMarket === "OTC" ? `${pair} OTC` : pair;
                const data = pairPrices[pair];
                const isUp = parseFloat(data.change) >= 0;

                const card = document.createElement('div');
                card.className = 'pair-card';
                card.onclick = () => selectPair(fullName);
                card.innerHTML = `
                    <div class="pair-title">${fullName}</div>
                    <div class="pair-type">${currentPlatform} • ${currentMarket}</div>
                    <div class="price-row">
                        <span>${data.price}</span>
                        <span class="${isUp ? 'price-up' : 'price-down'}">${isUp ? '+' : ''}${data.change}%</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function selectPair(pairName) {
            selectedPair = pairName;
            document.getElementById('active-pair-name').innerText = selectedPair;
            document.getElementById('active-platform-tag').innerText = `${currentPlatform} ${currentMarket}`;
            showPage('signal');
        }

        function showPage(page) {
            document.getElementById('page-select').classList.toggle('hidden', page !== 'select');
            document.getElementById('page-signal').classList.toggle('hidden', page !== 'signal');
        }

        function playBuzzer() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = "square";
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.25);
            } catch (e) {}
        }

        function generateSignal() {
            playBuzzer();
            const isCall = Math.random() > 0.5;
            document.getElementById('modal-pair').innerText = selectedPair;
            const sigEl = document.getElementById('modal-signal');
            sigEl.innerText = isCall ? "CALL ▲" : "PUT ▼";
            sigEl.className = isCall ? "signal-call" : "signal-put";
            document.getElementById('signal-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('signal-modal').classList.add('hidden');
        }

        setInterval(() => {
            rawPairs.forEach(p => {
                let diff = (Math.random() * 0.002 - 0.001);
                let newP = (parseFloat(pairPrices[p].price) + diff).toFixed(4);
                let newC = (Math.random() * 2 - 1).toFixed(2);
                pairPrices[p] = { price: newP, change: newC };
            });
            if (!document.getElementById('page-select').classList.contains('hidden')) {
                renderPairs();
            }
        }, 3000);

        initPrices();
        renderPairs();
    </script>
</body>
</html>
